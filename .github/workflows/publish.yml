name: Publish rockin

on:
  push:
    branches:
      - main
    paths:
      - "packages/rockin/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-ui
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types and build package
        run: |
          bun run typecheck
          bun run build:ui

      - name: Increment patch version
        working-directory: packages/rockin
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view rockin version)
          NEXT_VERSION=$(node -e '
            const versions = process.argv.slice(1).map((version) => version.split(".").map(Number));
            const base = versions.sort((a, b) => {
              for (let i = 0; i < 3; i++) {
                if (a[i] !== b[i]) return b[i] - a[i];
              }
              return 0;
            })[0];
            console.log(`${base[0]}.${base[1]}.${base[2] + 1}`);
          ' "$LOCAL_VERSION" "$PUBLISHED_VERSION")
          npm version "$NEXT_VERSION" --no-git-tag-version --workspaces=false

      - name: Publish package to npm
        run: npm publish ./packages/rockin --access public

      - name: Commit published version
        run: |
          VERSION=$(node -p "require('./packages/rockin/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rockin/package.json
          git commit -m "chore: release rockin@$VERSION [skip ci]"
          git push
