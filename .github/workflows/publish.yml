name: Publish rockin

on:
  push:
    branches:
      - main
    paths:
      - "packages/ui/**"
      - "package.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-ui
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      - name: Check types and build package
        run: |
          bun run typecheck
          bun run build:ui

      - name: Increment patch version
        working-directory: packages/ui
        run: npm version patch --no-git-tag-version --workspaces=false

      - name: Publish package to npm
        run: npm publish ./packages/ui --access public

      - name: Commit published version
        run: |
          VERSION=$(node -p "require('./packages/ui/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ui/package.json
          git commit -m "chore: release rockin@$VERSION [skip ci]"
          git push
